<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno | Sistema Acadêmico</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="cabecalho">
        <h1>Sistema de Gerenciamento Acadêmico</h1>
        <span>Área Acadêmica</span>
    </header>
    <nav aria-label="Navegação principal">
        <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="alunos.html">Alunos</a></li>
            <li><a href="cursos.html">Cursos</a></li>
            <li><a href="matriculas.html">Matrículas</a></li>
            <li><a href="usuarios.html">Usuários</a></li>
        </ul>
    </nav>

    <main>
        <h2 id="titulo-form-aluno">Cadastro de Aluno</h2>
        <form id="form-aluno">
            <input type="hidden" id="aluno-id" name="id">
            <fieldset>
                <legend>Dados do Aluno</legend>
                <p>
                    <label for="aluno-nome">Nome:</label>
                    <input type="text" id="aluno-nome" name="nome" minlength="3" required>
                </p>
                <p>
                    <label for="aluno-cpf">CPF:</label>
                    <input type="text" id="aluno-cpf" name="cpf" maxlength="14" required>
                </p>
                <p>
                    <label for="aluno-nascimento">Data de nascimento:</label>
                    <input type="date" id="aluno-nascimento" name="nascimento">
                </p>
                <p>
                    <label for="aluno-email">E-mail:</label>
                    <input type="email" id="aluno-email" name="email" required>
                </p>
                <p>
                    <label for="aluno-telefone">Telefone:</label>
                    <input type="tel" id="aluno-telefone" name="telefone">
                </p>
                <p>
                    <label for="aluno-cidade">Cidade:</label>
                    <input type="text" id="aluno-cidade" name="cidade">
                </p>
                <p>
                    <label for="aluno-estado">Estado:</label>
                    <input type="text" id="aluno-estado" name="estado" maxlength="2">
                </p>
                <p>
                    <label for="aluno-status">Status:</label>
                    <select id="aluno-status" name="status" required>
                        <option value="">Selecione</option>
                        <option value="ativo">Ativo</option>
                        <option value="inativo">Inativo</option>
                    </select>
                </p>
            </fieldset>
            <div class="acoes">
                <a class="link-acao" href="alunos.html">Cancelar</a>
                <button type="submit">Salvar</button>
                <button type="reset" class="botao-secundario">Limpar</button>
            </div>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Sistema de Gerenciamento Acadêmico - Univest</p>
    </footer>
    <script src="js/dados.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
