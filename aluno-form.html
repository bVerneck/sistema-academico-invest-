<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Aluno</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="cabecalho">
        <h1>Sistema de Gerenciamento Acadêmico</h1>
        <span>Área Acadêmica</span>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="alunos.html">Alunos</a></li>
            <li><a href="cursos.html">Cursos</a></li>
            <li><a href="matriculas.html">Matrículas</a></li>
            <li><a href="usuarios.html">Usuários</a></li>
        </ul>
    </nav>

    <main>
        <h2>Cadastro de Aluno</h2>

        <form action="#" method="post">
            <fieldset>
                <legend>Dados do Aluno</legend>

                <p>
                    <label for="nome">Nome:</label><br>
                    <input type="text" id="nome" name="nome" minlength="3" required>
                </p>
                <p>
                    <label for="cpf">CPF:</label><br>
                    <input type="text" id="cpf" name="cpf" maxlength="14" required>
                </p>
                <p>
                    <label for="nascimento">Data de nascimento:</label><br>
                    <input type="date" id="nascimento" name="nascimento" required>
                </p>
                <p>
                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
                    <label for="telefone">Telefone:</label><br>
                    <input type="tel" id="telefone" name="telefone">
                </p>
                <p>
                    <label for="cidade">Cidade:</label><br>
                    <input type="text" id="cidade" name="cidade">
                </p>
                <p>
                    <label for="estado">Estado:</label><br>
                    <input type="text" id="estado" name="estado" maxlength="2">
                </p>
                <p>
                    <label for="status">Status:</label><br>
                    <select id="status" name="status" required>
                        <option value="">Selecione</option>
                        <option value="ativo">Ativo</option>
                        <option value="inativo">Inativo</option>
                    </select>
                </p>
            </fieldset>

            <div class="acoes">
                <a class="link-acao" href="alunos.html">Cancelar</a>
                <button type="submit">Salvar</button>
                <button type="reset" class="botao-secundario">Limpar</button>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Sistema de Gerenciamento Acadêmico - Univest</p>
    </footer>

</body>
</html>
