<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Curso | Sistema Acadêmico</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="cabecalho">
        <h1>Sistema de Gerenciamento Acadêmico</h1>
        <span>Área Acadêmica</span>
    </header>
    <nav aria-label="Navegação principal">
        <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="alunos.html">Alunos</a></li>
            <li><a href="cursos.html">Cursos</a></li>
            <li><a href="matriculas.html">Matrículas</a></li>
            <li><a href="usuarios.html">Usuários</a></li>
        </ul>
    </nav>

    <main>
        <h2 id="titulo-form-curso">Cadastro de Curso</h2>
        <form id="form-curso">
            <input type="hidden" id="curso-id" name="id">
            <fieldset>
                <legend>Dados do Curso</legend>
                <p>
                    <label for="curso-nome">Nome do curso:</label>
                    <input type="text" id="curso-nome" name="nome" minlength="3" required>
                </p>
                <p>
                    <label for="curso-codigo">Código:</label>
                    <input type="text" id="curso-codigo" name="codigo" required>
                </p>
                <p>
                    <label for="curso-duracao">Duração (semestres):</label>
                    <input type="number" id="curso-duracao" name="duracao" min="1" max="12" required>
                </p>
                <p>
                    <label for="curso-turno">Turno:</label>
                    <select id="curso-turno" name="turno" required>
                        <option value="">Selecione</option>
                        <option value="matutino">Matutino</option>
                        <option value="vespertino">Vespertino</option>
                        <option value="noturno">Noturno</option>
                    </select>
                </p>
                <p>
                    <label for="curso-status">Status:</label>
                    <select id="curso-status" name="status" required>
                        <option value="">Selecione</option>
                        <option value="ativo">Ativo</option>
                        <option value="inativo">Inativo</option>
                    </select>
                </p>
            </fieldset>
            <div class="acoes">
                <a class="link-acao" href="cursos.html">Cancelar</a>
                <button type="submit">Salvar</button>
                <button type="reset" class="botao-secundario">Limpar</button>
            </div>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Sistema de Gerenciamento Acadêmico - Univest</p>
    </footer>
    <script src="js/dados.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
