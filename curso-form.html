<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Curso</title>
</head>
<body>
    <header>
        <h1>Sistema de Gerenciamento Acadêmico</h1>
        <nav>
            <a href="index.html">Dashboard</a> |
            <a href="alunos.html">Alunos</a> |
            <a href="cursos.html">Cursos</a> |
            <a href="matriculas.html">Matrículas</a> |
            <a href="usuarios.html">Usuários</a>
        </nav>
    </header>

    <main>
        <h2>Cadastro de Curso</h2>

        <form action="#" method="post">
            <p>
                <label for="codigo">Código:</label><br>
                <input type="text" id="codigo" name="codigo" required>
            </p>

            <p>
                <label for="nome">Nome:</label><br>
                <input type="text" id="nome" name="nome" minlength="3" required>
            </p>

            <p>
                <label for="descricao">Descrição:</label><br>
                <textarea id="descricao" name="descricao" rows="4" cols="40"></textarea>
            </p>

            <p>
                <label for="cargaHoraria">Carga horária (horas):</label><br>
                <input type="number" id="cargaHoraria" name="cargaHoraria" min="1" required>
            </p>

            <p>
                <label for="duracao">Duração (semestres):</label><br>
                <input type="number" id="duracao" name="duracao" min="1" required>
            </p>

            <p>
                <label for="modalidade">Modalidade:</label><br>
                <select id="modalidade" name="modalidade" required>
                    <option value="">Selecione</option>
                    <option value="presencial">Presencial</option>
                    <option value="ead">EAD</option>
                    <option value="hibrido">Híbrido</option>
                </select>
            </p>

            <p>
                <label for="status">Status:</label><br>
                <select id="status" name="status" required>
                    <option value="">Selecione</option>
                    <option value="ativo">Ativo</option>
                    <option value="inativo">Inativo</option>
                </select>
            </p>

            <p>
                <button type="submit">Salvar</button>
                <a href="cursos.html">Cancelar</a>
            </p>
        </form>
    </main>
</body>
</html>
