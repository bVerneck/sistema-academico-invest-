<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Curso</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="cabecalho">
        <h1>Sistema de Gerenciamento Acadêmico</h1>
        <span>Área Acadêmica</span>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="alunos.html">Alunos</a></li>
            <li><a href="cursos.html">Cursos</a></li>
            <li><a href="matriculas.html">Matrículas</a></li>
            <li><a href="usuarios.html">Usuários</a></li>
        </ul>
    </nav>

    <main>
        <h2>Cadastro de Curso</h2>

        <form action="#" method="post">
            <fieldset>
                <legend>Dados do Curso</legend>

                <p>
                    <label for="nome">Nome do curso:</label><br>
                    <input type="text" id="nome" name="nome" minlength="3" required>
                </p>
                <p>
                    <label for="codigo">Código:</label><br>
                    <input type="text" id="codigo" name="codigo" required>
                </p>
                <p>
                    <label for="duracao">Duração (semestres):</label><br>
                    <input type="number" id="duracao" name="duracao" min="1" max="12" required>
                </p>
                <p>
                    <label for="turno">Turno:</label><br>
                    <select id="turno" name="turno" required>
                        <option value="">Selecione</option>
                        <option value="matutino">Matutino</option>
                        <option value="vespertino">Vespertino</option>
                        <option value="noturno">Noturno</option>
                    </select>
                </p>
                <p>
                    <label for="status">Status:</label><br>
                    <select id="status" name="status" required>
                        <option value="">Selecione</option>
                        <option value="ativo">Ativo</option>
                        <option value="inativo">Inativo</option>
                    </select>
                </p>
            </fieldset>

            <div class="acoes">
                <a class="link-acao" href="cursos.html">Cancelar</a>
                <button type="submit">Salvar</button>
                <button type="reset" class="botao-secundario">Limpar</button>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Sistema de Gerenciamento Acadêmico - Univest</p>
    </footer>

</body>
</html>
