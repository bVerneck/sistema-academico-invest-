<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Matrícula | Sistema Acadêmico</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="cabecalho">
        <h1>Sistema de Gerenciamento Acadêmico</h1>
        <span>Área Acadêmica</span>
    </header>
    <nav aria-label="Navegação principal">
        <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="alunos.html">Alunos</a></li>
            <li><a href="cursos.html">Cursos</a></li>
            <li><a href="matriculas.html">Matrículas</a></li>
            <li><a href="usuarios.html">Usuários</a></li>
        </ul>
    </nav>

    <main>
        <h2 id="titulo-form-matricula">Cadastro de Matrícula</h2>
        <form id="form-matricula">
            <input type="hidden" id="matricula-id" name="id">
            <fieldset>
                <legend>Dados da Matrícula</legend>
                <p>
                    <label for="matricula-aluno">Aluno:</label>
                    <select id="matricula-aluno" name="alunoId" required>
                        <option value="">Selecione</option>
                    </select>
                </p>
                <p>
                    <label for="matricula-curso">Curso:</label>
                    <select id="matricula-curso" name="cursoId" required>
                        <option value="">Selecione</option>
                    </select>
                </p>
                <p>
                    <label for="matricula-data">Data da matrícula:</label>
                    <input type="date" id="matricula-data" name="data" required>
                </p>
                <p>
                    <label for="matricula-situacao">Situação:</label>
                    <select id="matricula-situacao" name="situacao" required>
                        <option value="">Selecione</option>
                        <option value="ativa">Ativa</option>
                        <option value="trancada">Trancada</option>
                        <option value="cancelada">Cancelada</option>
                    </select>
                </p>
            </fieldset>
            <div class="acoes">
                <a class="link-acao" href="matriculas.html">Cancelar</a>
                <button type="submit">Salvar</button>
                <button type="reset" class="botao-secundario">Limpar</button>
            </div>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Sistema de Gerenciamento Acadêmico - Univest</p>
    </footer>
    <script src="js/dados.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
