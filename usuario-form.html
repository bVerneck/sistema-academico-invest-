<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Sistema de Gerenciamento Acadêmico</h1>
        <nav>
            <a href="index.html">Dashboard</a> |
            <a href="alunos.html">Alunos</a> |
            <a href="cursos.html">Cursos</a> |
            <a href="matriculas.html">Matrículas</a> |
            <a href="usuarios.html">Usuários</a>
        </nav>
    </header>

    <main>
        <h2>Cadastro de Usuário</h2>

        <form action="#" method="post">
            <fieldset>
                <legend>Dados do Usuário</legend>
                <p>
                    <label for="nome">Nome:</label><br>
                    <input type="text" id="nome" name="nome" minlength="3" required>
                </p>
                <p>
                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
                    <label for="login">Login:</label><br>
                    <input type="text" id="login" name="login" required>
                </p>
                <p>
                    <label for="senha">Senha:</label><br>
                    <input type="password" id="senha" name="senha" minlength="6" required>
                </p>
                <p>
                    <label for="perfil">Perfil:</label><br>
                    <select id="perfil" name="perfil" required>
                        <option value="">Selecione</option>
                        <option value="administrador">Administrador</option>
                        <option value="secretaria">Secretaria</option>
                        <option value="professor">Professor</option>
                    </select>
                </p>
                <p>
                    <label for="status">Status:</label><br>
                    <select id="status" name="status" required>
                        <option value="">Selecione</option>
                        <option value="ativo">Ativo</option>
                        <option value="inativo">Inativo</option>
                    </select>
                </p>

            </fieldset>

            <p>
                <button type="submit">Salvar</button>
                <button type="reset" class="botao-secundario">Limpar</button>
                <a href="usuarios.html">Cancelar</a>
            </p>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Sistema de Gerenciamento Acadêmico - Univest</p>
    </footer>
</body>
</html>
